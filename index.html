<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate how many classes you need to attend or can safely miss while meeting your attendance target.">
    <title>Attendance Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <h1>Attendance Planner <i class="fas fa-chart-bar header-icon" aria-hidden="true"></i></h1>
        <p class="powered-by-main">BUILT BY <span class="author-name-styled">NIHARIKA VEMULA</span></p>

        <p class="description">
            <i class="fas fa-info-circle info-icon" aria-hidden="true"></i> Calculate how many classes you may miss—or need to attend—to reach your target.
        </p>

        <div class="input-group">
            <label for="required-percentage">Percentage Required</label>
            <select id="required-percentage">
                <option value="60">60%</option>
                <option value="65">65%</option>
                <option value="70">70%</option>
                <option value="75" selected>75%</option>
                <option value="80">80%</option>
                <option value="85">85%</option>
                <option value="90">90%</option>
            </select>
        </div>

        <div class="input-group">
            <label for="classes-attended">Present classes</label>
            <input type="number" id="classes-attended" min="0" value="0" inputmode="numeric" required>
        </div>

        <div class="input-group">
            <label for="total-classes">Total classes</label>
            <input type="number" id="total-classes" min="0" value="0" inputmode="numeric" required>
        </div>

        <button id="calculate-button" type="button">Calculate attendance</button>

        <div class="results-area" aria-live="polite">
            <p id="action-needed" class="result-message">Enter your attendance details to begin.</p>
            <p class="result-detail">Current Attendance: <span id="current-fraction">--/--</span> → <span id="current-percentage" class="percentage-value">--%</span></p>
            <p class="result-detail">Attendance Required: <span id="required-fraction">--/--</span> → <span id="required-percentage-display" class="percentage-value">--%</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
